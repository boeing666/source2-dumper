name: Download depots

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game
        type: choice
        options: [cs2, dota2, deadlock]
        default: cs2

jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/steamfiledownloader

      - name: Download ${{ matrix.target }} files
        env:
          GAME: ${{ github.event.inputs.game }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        shell: bash
        run: bash scripts/download-depots.sh ${{ matrix.target }}

      - name: Upload ${{ matrix.target }} files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.game }}-${{ matrix.target }}
          path: game/
          if-no-files-found: error
